name: Build and Deploy

on:
  push:
    branches:
      - nuxt3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0' # 选择适合的 Node.js 版本
      
      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install
      
      - name: Build project
        run: yarn generate
      
      - name: Deploy to EdgeOne Pages
        run: npx edgeone pages deploy ./.output/public -n kagamine-fans -t ${{ secrets.EDGEONE_API_TOKEN }} -e production
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}